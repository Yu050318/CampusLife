# ============================================================
#  城市点评系统 · 后端配置模板
# ------------------------------------------------------------
#  使用方式：
#  1. 复制本文件为 application.yaml：
#       copy application-example.yaml application.yaml
#  2. 将下方 ${...} 占位符替换为你自己的真实配置
#     （推荐改用环境变量注入，避免密钥写入代码仓库）
#
#  注意：真实的 application.yaml 已被 .gitignore 排除，
#        请勿将任何真实密钥提交到 Git 仓库！
# ============================================================

server:
  port: 8081
spring:
  application:
    name: my_project
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/city-reviews?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # 数据库密码（建议通过环境变量注入：${DB_PASSWORD}）
    password: your-database-password
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
mybatis-plus:
  type-aliases-package: com.cn.entity # 别名扫描包
logging:
  level:
    com.cn: debug
  pattern:
    dateformat: mm:ss.SSS
# JWT 配置
jwt:
  # JWT 签名密钥（请替换为随机字符串，建议长度 >= 32 字符）
  secret: ${JWT_SECRET:your-jwt-secret-key-change-me}
  expiration: 10800000  # 3小时 = 3 × 60 × 60 × 1000
# 阿里云 OSS 配置（图片上传）
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket: your-bucket-name
    access-key-id: ${OSS_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
    domain: https://your-bucket-name.oss-cn-beijing.aliyuncs.com
